<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>User Login</title>

		<link rel="stylesheet" href="src/css/styles.css" />
	</head>

	<body
		class="min-h-screen flex items-center justify-center bg-linear-to-br from-slate-900 via-slate-800 to-slate-900 px-4"
	>
		<!-- Login Card -->
		<div
			class="w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden"
		>
			<div class="bg-linear-to-r from-sky-500 to-blue-700 p-8">
				<h1 class="text-white text-3xl font-bold text-center mt-6">
					Welcome Back
				</h1>

				<p class="text-center text-blue-100 mt-2">Login to continue</p>
			</div>

			<!-- Form Section -->
			<div class="p-8">
				<form id="loginForm" class="space-y-6">
					<!-- Username BOX-->
					<div>
						<label
							for="username"
							class="block text-sm font-medium text-slate-700 mb-2"
						>
							Username
						</label>

						<input
							type="text"
							id="username"
							placeholder="Enter your username"
							required
							pattern=".*\S+"
							title="No spaces allowed"
							class="w-full px-4 py-3 border border-slate-300 rounded-xl outline-none transition focus:ring-2 focus:ring-sky-400 focus:border-sky-400"
						/>
					</div>
					<!-- Username BOX-->

					<!-- Password BOX -->
					<div>
						<label
							for="password"
							class="block text-sm font-medium text-slate-700 mb-2"
						>
							Password
						</label>

						<input
							type="password"
							id="password"
							placeholder="Enter your password"
							required
							pattern=".*\S+"
							title="No spaces allowed"
							class="w-full px-4 py-3 border border-slate-300 rounded-xl outline-none transition focus:ring-2 focus:ring-sky-400 focus:border-sky-400"
						/>
					</div>
					<!-- Password BOX -->

					<button
						type="submit"
						class="w-full py-3 rounded-xl text-white font-semibold bg-linear-to-r from-sky-500 to-blue-600 hover:from-green-500 hover:to-emerald-600 transform hover:scale-105 transition duration-300 shadow-lg"
					>
						Login
					</button>
				</form>

				<!-- Error Message -->
				<div id="errorMessage" class="text-center text-red-500 mt-6"></div>
			</div>
			<!-- Form Section -->
		</div>
		<!-- Login Card -->

		<script src="src/scripts/login.js"></script>
	</body>
</html>
